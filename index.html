<style>
/* Layout: jedna sloupcová mobilní aplikace — sticky hlavička se záložkami, karty cviků pod sebou, dole lišta s pauzou. */
:root{
  --bg:#eef0ec; --surface:#ffffff; --ink:#15191c; --muted:#59626a; --line:#d6dbd4;
  --chip:#e6e9e3; --accent:#b8430f; --accent-ink:#ffffff; --good:#16723a; --warn:#a15c06; --bad:#b42318;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111416; --surface:#1a1e21; --ink:#e8ebed; --muted:#98a2aa; --line:#2b3136;
  --chip:#242a2e; --accent:#f07a3a; --accent-ink:#141618; --good:#4cc27a; --warn:#f0b13c; --bad:#f2786c; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111416; --surface:#1a1e21; --ink:#e8ebed; --muted:#98a2aa; --line:#2b3136;
  --chip:#242a2e; --accent:#f07a3a; --accent-ink:#141618; --good:#4cc27a; --warn:#f0b13c; --bad:#f2786c; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
label.secondary{cursor:pointer;display:inline-block}
.bells{display:inline-flex;gap:2px}
.bells button{border:0;background:none;padding:4px 3px;cursor:pointer;color:var(--line);line-height:0}
.bells button.on{color:var(--accent)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.7rem;letter-spacing:.01em;margin:0;text-transform:uppercase}
.status{font-size:.78rem;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);border-radius:var(--r);padding:4px}
.tabs button{font:600 .95rem var(--body);border:0;border-radius:7px;padding:9px 4px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{display:grid;gap:14px;padding-top:6px}
.hero{display:grid;gap:4px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;margin:0;text-wrap:balance}
.big .tpl{color:var(--accent)}
.sub{color:var(--muted);font-size:.92rem}
.linkbtn{border:0;background:none;color:var(--accent);font:600 .9rem var(--body);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.alert{border-left:4px solid var(--warn);background:var(--surface);padding:10px 12px;border-radius:0 var(--r) var(--r) 0;font-size:.92rem;display:grid;gap:6px}
.alert.bad{border-color:var(--bad)}
.alert b{font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-h h2{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0;line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
.tag{font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--chip);padding:3px 7px;border-radius:5px;white-space:nowrap}
.rx{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.load{display:flex;align-items:center;gap:6px}
.load input{width:5.2rem;font:700 1.35rem var(--display);text-align:center;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.unit{color:var(--muted);font-weight:600}
.target{font-family:var(--display);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.stage{font-weight:600}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.set{display:grid;gap:3px}
.set label{font-size:.72rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stepper{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;background:var(--chip);color:var(--ink);font:600 1.1rem var(--body);height:40px;cursor:pointer}
.stepper input{border:0;background:transparent;color:var(--ink);text-align:center;font:700 1.25rem var(--display);width:100%;min-width:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set.miss .stepper{border-color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .88rem var(--body);padding:6px 10px;border-radius:6px;cursor:pointer;min-width:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seglabel{font-size:.8rem;color:var(--muted)}
.cue{font-size:.86rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.restbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 .85rem var(--body);padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.sublabel{font-size:.8rem;color:var(--muted);font-weight:600}

.primary{border:0;background:var(--accent);color:var(--accent-ink);font:700 1.15rem var(--display);text-transform:uppercase;letter-spacing:.04em;padding:14px;border-radius:var(--r);cursor:pointer;width:100%}
.secondary{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .95rem var(--body);padding:10px 12px;border-radius:8px;cursor:pointer}
.danger{border-color:var(--bad);color:var(--bad)}

.nextlist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.nextlist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;font-variant-numeric:tabular-nums}
.nextlist li:last-child{border-bottom:0}
.up{color:var(--good);font-weight:600}
.hold{color:var(--muted)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);font-weight:600}
.field input,.field select{font:500 1rem var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{display:grid;gap:2px}
.kpi .v{font-family:var(--display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1}
.kpi .l{font-size:.75rem;color:var(--muted)}
.bar{height:10px;background:var(--chip);border-radius:5px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.chart svg{width:100%;height:auto;display:block}
.chart h3{margin:0;font:700 1rem var(--display);text-transform:uppercase;letter-spacing:.02em;display:flex;justify-content:space-between}
.chart h3 span{color:var(--accent);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:.9rem}
.hist{display:grid;gap:0;margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.hist li:last-child{border-bottom:0}
.hist .t{font:700 1.1rem var(--display);color:var(--accent)}
.hist .d{color:var(--muted);font-size:.8rem}
.edit{display:grid;gap:8px}
.edit .er{display:grid;grid-template-columns:1fr 5rem 4rem;gap:8px;align-items:center;font-size:.9rem}
.edit .er input,.edit .er select{font:600 .95rem var(--body);padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.edit .eh{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer .tt{font:700 1.8rem var(--display);font-variant-numeric:tabular-nums}
.timer.done{background:var(--good);color:#fff}
.timer button{border:1px solid currentColor;background:transparent;color:inherit;font:600 .9rem var(--body);padding:7px 12px;border-radius:8px;cursor:pointer}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.todo li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.todo li:last-child{border-bottom:0;padding-bottom:0}
.todo .d{color:var(--muted);font-size:.82rem}
.review{border-color:var(--good)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:.9rem;z-index:30;max-width:90vw}
@media (prefers-reduced-motion: no-preference){ .toast{transition:opacity .2s} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand"><h1>Garážový deník</h1><span class="status" id="status">Načítám data…</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="dnes" aria-selected="true">Dnes</button>
      <button role="tab" data-tab="telo" aria-selected="false">Tělo a kondice</button>
      <button role="tab" data-tab="prehled" aria-selected="false">Přehled</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div class="timer" id="timer" hidden><div><div class="sublabel" id="timerLabel" style="color:inherit;opacity:.8">Pauza</div><div class="tt" id="timerT">0:00</div></div><div style="display:flex;gap:8px"><button id="timerAdd">+30 s</button><button id="timerStop">Konec</button></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Program ---------- */
const EX = {
  squat:{name:'Dřep s osou',extra:'Lýtka po každé sérii, než odložíš osu: výpony špičkami na kotouči, 10–12×, dole 2 s protažení, nahoře 1 s. Kymácíš se? Po dřepu jednonož na schodu s KB 24 kg, 2–3 × 10–15 na nohu.',type:'bar',sets:3,min:5,max:8,inc:2,start:55,t0:5,rest:150,
    cue:'Nádech do břicha a zpevnit před sestupem. Dech drž dolů i nahoru, výdech až nahoře.'},
  benchA:{name:'Bench press',type:'bar',sets:3,min:8,max:10,inc:2,start:55,t0:8,rest:120,pain:true,rir2:true,tag:'šetrně k rameni',
    cue:'Lopatky stažené, lokty asi 45° od těla, spouštět 2 s. Nádech nahoře, výdech po nejtěžším bodě. Rezerva 2 opakování; ostrá bolest v rameni = konec série.'},
  row:{name:'Přítah osy v předklonu',type:'bar',sets:3,min:6,max:10,inc:2,start:55,t0:8,rest:90,
    cue:'Nádech dole, zadrž při tahu, výdech při stisku lopatek. Trup se nehýbe, jinak je váha moc.'},
  ohpA:{name:'Military press',type:'bar',sets:2,min:5,max:8,inc:2,start:37,t0:8,rest:90,pain:true,tag:'lehčí',
    cue:'Zpevni hýždě a břicho, nádech dole, výdech nahoře. Opakování s pomocí nohou se nepočítá, zapiš jen čistá.'},
  curl:{name:'EZ curl',type:'ez',sets:3,min:10,max:15,inc:1,start:14,t0:10,cap:14,rest:0,tag:'supersérie 1/2',
    cue:'Lokty u těla. Výdech při zdvihu, nádech při spouštění 2–3 s. Hned pokračuj úzkými kliky.'},
  tri:{name:'Úzké kliky',type:'stage',sets:3,min:8,max:10,t0:8,rest:60,tag:'supersérie 2/2',
    stages:['Vlastní váha','Vesta 4 kg','Vesta 4 kg · nohy na lavici','Vesta + lavice · spouštění 3 s'],
    cue:'Ruce na šíři ramen, lokty podél těla, tělo jako prkno. Nádech dolů, výdech nahoru. Bez selhání.'},
  dl:{name:'Mrtvý tah',type:'dl',sets:3,min:4,max:6,inc:2,start:92,t0:5,rest:150,pain:true,rir2:true,
    cue:'Každé opakování znovu nastavit. Nádech do břicha a zpevnit, výdech nahoře. Zpomaluje se tempo? Nepřidávej.'},
  ohpB:{name:'Military press',type:'bar',sets:3,min:5,max:8,inc:2,start:42,t0:6,rest:120,pain:true,
    cue:'Zpevni hýždě a břicho, nádech dole, výdech nahoře. Opakování s pomocí nohou se nepočítá, zapiš jen čistá.'},
  benchB:{name:'Bench press',type:'bar',sets:2,min:8,max:10,inc:2,start:50,t0:8,rest:90,pain:true,rir2:true,tag:'lehčí',
    cue:'Stejná technika jako v A. Rezerva 2 opakování.'},
  kbrow:{name:'Přítah KB o lavici',type:'stage',sets:3,min:8,max:12,t0:10,per:'ruku',rest:75,
    stages:['KB 24 kg','KB 24 kg · spouštění 3 s','KB 24 kg · pauza 1 s nahoře'],
    cue:'Volná ruka pevně o lavici. Výdech při tahu, nádech při spouštění.'},
  bg:{name:'Bulharský dřep',type:'stage',sets:2,min:8,max:12,t0:10,per:'nohu',rest:75,
    stages:['KB 16 kg goblet','KB 24 kg goblet','KB 24 kg + vesta','16 + 24 kg v rukou (střídat strany)'],
    cue:'Nádech před sestupem, výdech při výstupu. Sestup kolmo dolů.'},
  rear:{name:'Zadní ramena vleže',type:'stage',sets:2,min:12,max:15,rest:45,
    stages:['Zátěže 1,5 kg','1,5 kg · výdrž 2 s nahoře','1,5 kg · spouštění 3 s'],
    cue:'Na břiše na lavici. Pohyb jde od lopatek, výdech při zdvihu.'}
};
const TPL = {
  A:{keys:['squat','benchA','row','curl','tri'], label:'dřep · bench · přítah'},
  B:{keys:['dl','ohpB','benchB','kbrow','bg'], label:'mrtvý tah · military · záda'}
};
const MAIN = [['squat','Dřep'],['benchA','Bench'],['dl','Mrtvý tah'],['ohpB','Military']];

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmt = n => n == null ? '–' : (Math.round(n * 10) / 10).toLocaleString('cs-CZ');
const round = (x, step) => Math.round(x / step) * step;
const today = () => new Date().toLocaleDateString('sv-SE');
const dcz = d => { const [y, m, dd] = d.split('-'); return `${+dd}. ${+m}.`; };
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lsGet(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600); }

/* ---------- State ---------- */
function defaultState(){
  const prog = {};
  for (const k in EX) prog[k] = { w: EX[k].start ?? null, t: EX[k].t0 ?? EX[k].min, stage: 0, stall: 0 };
  return { v:1, prog, next:'A', metrics:[], cardio:[] };
}
function mergeState(s){

/* ---------- Progression ---------- */
function stepFor(def){ return def.type === 'ez' ? 0.5 : 1; }
function backoff(w){ return round(w * 0.9, 1); }
function progress(k, p, res){
  const def = EX[k];
  const np = { ...p };
  if (def.pain && (res.pain || 0) >= 3) { if (res.w != null) np.w = Math.min(res.w, p.w); return { np, progressed:false, note:`bolest ${res.pain >= 5 ? '5+' : res.pain}/10, drž` }; }
  if (def.type !== 'stage' && res.w != null) np.w = res.w;
  const ok = res.reps.length && res.reps.every(r => r >= p.t);
  const minRir = def.rir2 ? 2 : 1;
  const noReserve = (def.type === 'bar' || def.type === 'dl') && (res.rir == null ? !!def.rir2 : res.rir < minRir);
  let progressed = false, note = '', capHold = false;
  if (ok) {
    if (p.t < def.max) { np.t = p.t + 1; progressed = true; note = `+1 opakování`; }
    else if (def.type === 'stage') {
      if (p.stage < def.stages.length - 1) { np.stage = p.stage + 1; np.t = def.min; progressed = true; note = 'další stupeň'; }
      else { note = 'strop vybavení, drž'; capHold = true; }
    } else if (noReserve) { note = res.rir == null ? 'zadej rezervu, váhu drž' : `rezerva pod ${minRir}, váhu drž`; }
    else if (def.cap && np.w + def.inc > def.cap) { note = 'strop EZ, zpomal spouštění'; capHold = true; }
    else { np.w = round(np.w + def.inc, stepFor(def)); np.t = def.min; progressed = true; note = `+${fmt(def.inc)} kg`; }
  } else note = 'stejně, dorovnej';
  np.stall = (progressed || capHold) ? 0 : (p.stall || 0) + 1;
  return { np, progressed, note };
}

  }

}

}

/* ---------- Warnings ---------- */
function warnings(){
  const out = [];

  if (stalled.length) out.push({ cls:'', html:`<b>Stagnace:</b> ${stalled.map(k => EX[k].name + (k.endsWith('A') ? ' (A)' : k.endsWith('B') ? ' (B)' : '')).join(', ')} – 4 tréninky bez posunu. Zvaž deload: −10 % váhy a znovu nahoru.<div><button class="secondary" data-act="deload">Udělat deload těchto cviků</button></div>` });
  const dkeys = draft ? TPL[draft.tpl].keys : [];
  for (const k of dkeys.filter(k => EX[k].pain)) {
    const hist = SESS.filter(s => s.items[k]).slice(-2);
    const lp = hist.length ? (hist[hist.length - 1].items[k].pain || 0) : 0;
    if (lp >= 3) {
      const both = hist.length === 2 && hist.every(s => (s.items[k].pain || 0) >= 3);
      const nm = EX[k].name;
      out.push({ cls: both ? 'bad' : '', html: both
        ? `<b>${nm}:</b> bolest dvakrát po sobě. Uber 10 % v Ruční úpravě nebo cvik na týden vynech. Když bolest neustoupí, ať se na to podívá fyzioterapeut.`
        : `<b>${nm}:</b> minule bolest ${lp >= 5 ? '5+' : lp}/10, progrese stojí. Dnes stejná váha. Když zabolí znovu, sérii ukonči.` });
    }

  const last2 = SESS.slice(-2);
  if (last2.length === 2) {
    if (last2.every(s => s.ready && s.ready.sleep <= 2)) out.push({ cls:'bad', html:'<b>Regenerace:</b> dvakrát po sobě špatný spánek. Dnes vynech doplňky na konci a nech větší rezervu.' });

  }
  return out;
}

    <div class="field"><label for="c-d">Datum</label><input id="c-d" type="date" value="${today()}"></div></div>
    <button class="secondary" data-act="addcardio">Uložit</button>
    ${S.cardio.length ? `<ul class="hist">${[...S.cardio].sort((a,b)=>a.d<b.d?1:-1).slice(0,6).map(c => `<li><span class="d">${dcz(c.d)}</span><span>${esc(c.type)} · ${c.emom || c.min} min</span></li>`).join('')}</ul>` : ''}
    <p class="empty">Swing EMOM je intervalový trénink, ne zóna 2. Do cíle se nepočítá a nedávej ho hned po tréninku B.</p></section>`;
  return h;
}
const fmtDelta = d => (d > 0 ? '+' : d < 0 ? '−' : '±') + fmt(Math.abs(d));

/* ---------- Render: Přehled ---------- */
function renderOverview(){
  let h = `<section class="hero"><span class="eyebrow">${SESS.length} ${SESS.length === 1 ? 'trénink' : SESS.length >= 2 && SESS.length <= 4 ? 'tréninky' : 'tréninků'}</span><p class="big">Přehled</p></section>`;
  h += `<section class="card"><div class="card-h"><h2>Pracovní váhy</h2></div><div class="charts">`;
  let any = false;
  for (const [k, lab] of MAIN) {
    const pts = SESS.filter(s => s.items[k] && s.items[k].w != null);
    if (pts.length >= 2) { any = true; h += chart(lab, pts.map(s => s.items[k].w), pts.map(s => s.date), 'kg'); }
  }
  h += `</div>${any ? '' : '<p class="empty">Grafy hlavních cviků se objeví po dvou trénincích daného typu.</p>'}</section>`;
  h += `<section class="card"><div class="card-h"><h2>Historie</h2></div>`;
  if (!SESS.length) h += '<p class="empty">Zatím žádný uložený trénink. Ulož první na záložce Dnes.</p>';
  else {
    h += `<ul class="hist">${[...SESS].reverse().slice(0, 12).map(s => `<li><span class="t">${s.tpl}</span><span><span class="d">${dcz(s.date)}</span><br>${
      TPL[s.tpl].keys.filter(k => s.items[k]).map(k => `${esc(EX[k].name)} ${EX[k].type === 'stage' ? '' : fmt(s.items[k].w) + ' kg '}${s.items[k].reps.join('-')}`).join(' · ')}</span></li>`).join('')}</ul>
      <button class="secondary danger" data-act="dellast">Smazat poslední trénink a vrátit progresi</button>`;
  }
  h += `</section><section class="card"><div class="card-h"><h2>Ruční úprava</h2><span class="tag">když nesedí start</span></div><div class="edit">
    <div class="er eh"><span>Cvik</span><span>Váha</span><span>Cíl op.</span></div>`;
  for (const t of ['A','B']) for (const k of TPL[t].keys) {
    const def = EX[k], p = S.prog[k];
    h += `<div class="er"><span>${t} · ${esc(def.name)}</span>${def.type === 'stage'
      ? `<select id="e-s-${k}" data-es="${k}">${def.stages.map((s, i) => `<option value="${i}" ${i === p.stage ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>`
      : `<input id="e-w-${k}" data-ew="${k}" inputmode="decimal" value="${fmt(p.w)}">`}
      <input id="e-t-${k}" data-et="${k}" inputmode="numeric" value="${p.t}"></div>`;
  }
  h += `<button class="secondary" data-act="saveedit">Uložit úpravy</button></div></section>`;
  h += `<section class="card"><div class="card-h"><h2>Záloha</h2><span class="tag">jednou měsíčně</span></div>
    <p class="sub">Data jsou jen v tomto telefonu. Zálohu ulož do iCloudu, při výměně telefonu ji nahraješ zpět.${S.lastBackup ? ' Poslední: ' + dcz(S.lastBackup) + '.' : ''}</p>
    <div class="row" style="justify-content:flex-start"><button class="secondary" data-act="export">Stáhnout zálohu</button><label class="secondary" for="imp">Nahrát zálohu</label><input id="imp" type="file" accept="application/json,.json" hidden></div></section>`;
  return h;
}

/* ---------- Chart ---------- */
function chart(title, vals, dates, unit){
  const pts = vals.map((v, i) => ({ v, d: dates[i] })).filter(p => p.v != null);
  if (pts.length < 2) return '';
  const W = 300, H = 120, L = 34, R = 10, T = 10, B = 22;
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  const x = i => L + (W - L - R) * (i / (pts.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = `${L},${H - B} ${line} ${x(pts.length - 1).toFixed(1)},${H - B}`;
  const lastP = pts[pts.length - 1];
  return `<div class="chart"><h3>${esc(title)} <span>${fmt(lastP.v)} ${unit}</span></h3>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}: od ${fmt(pts[0].v)} do ${fmt(lastP.v)} ${unit}">
    <line x1="${L}" x2="${W - R}" y1="${y(hi)}" y2="${y(hi)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <line x1="${L}" x2="${W - R}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <text x="${L - 6}" y="${y(hi) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(hi)}</text>
    <text x="${L - 6}" y="${y(lo) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(lo)}</text>
    <polygon points="${area}" fill="var(--accent)" fill-opacity="0.12"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(lastP.v)}" r="4" fill="var(--accent)"/>
    <text x="${L}" y="${H - 6}" font-size="10" fill="var(--muted)">${dcz(pts[0].d)}</text>
    <text x="${W - R}" y="${H - 6}" font-size="10" fill="var(--muted)" text-anchor="end">${dcz(lastP.d)}</text>
  </svg></div>`;
}

/* ---------- Render root ---------- */
function render(){
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('#view').innerHTML = tab === 'dnes' ? renderToday() : tab === 'telo' ? renderBody() : renderOverview();
}
function setStatus(){
  $('#status').textContent = !loaded ? 'Načítám data…' : store.mode === 'db' ? 'Ukládá se do tvého účtu' : 'Data jsou uložená v tomto telefonu';
}

/* ---------- Actions ---------- */
async function saveWorkout(){
  const tpl = draft.tpl, before = clone(S.prog), rows = [];
  const items = {};
  for (const k of TPL[tpl].keys) {
    const def = EX[k], it = draft.items[k], p = S.prog[k];
    const w = def.type === 'stage' ? null : num(it.w);
    const res = { w, reps: it.reps.map(r => Math.max(0, num(r) ?? 0)), rir: it.rir, pain: it.pain || 0 };
    const { np, progressed, note } = progress(k, p, res);
    S.prog[k] = np;
    items[k] = { w: def.type === 'stage' ? null : res.w, stage: def.type === 'stage' ? p.stage : null, reps: res.reps, rir: res.rir, pain: res.pain };
    const nextTxt = def.type === 'stage' ? `${def.stages[np.stage]} · ${def.sets}×${np.t}` : `${fmt(np.w)} kg · ${def.type === 'dl' ? '1+2' : def.sets}×${np.t}`;
    rows.push({ name: def.name + (k === 'ohpA' || k === 'benchB' ? ' (lehčí)' : ''), next: nextTxt, note, up: progressed });
  }
  const sess = { kind:'session', id: 's' + Date.now(), date: draft.date, tpl, items, ready: { ...draft.ready }, before };
  SESS.push(sess);
  if (!S.start) S.start = draft.date;
  S.next = tpl === 'A' ? 'B' : 'A';
  lastResult = { tpl: S.next, rows };
  draft = newDraft(S.next); lsDel('gd_draft');
  render(); window.scrollTo({ top: 0 });
  try { await saveSession(sess); await saveState(); toast(`Uloženo. Příště trénink ${S.next}.`); } catch(e) { failSave(e); }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; render(); return; }
  if (b.dataset.step) {
    const k = b.dataset.step, i = +b.dataset.i, it = draft.items[k];
    it.reps[i] = Math.max(0, (num(it.reps[i]) ?? 0) + +b.dataset.d);
    persistDraft(); render(); return;
  }
  if (b.dataset.seg) {
    const f = b.dataset.seg, v = +b.dataset.v;
    if (f.startsWith('rir:')) { const it = draft.items[f.slice(4)]; it.rir = it.rir === v ? null : v; }
    else if (f.startsWith('pain:')) { draft.items[f.slice(5)].pain = v; }
    else if (f === 'joint') draft.ready.joint = v === 1;
    else draft.ready[f] = v;
    persistDraft(); render(); return;
  }
  if (b.dataset.rest) { startTimer(+b.dataset.rest, b.dataset.name); return; }
  const act = b.dataset.act;
  if (act === 'switch') { const t = draft.tpl === 'A' ? 'B' : 'A'; draft = newDraft(t); persistDraft(); render(); }
  else if (act === 'export') {
    S.lastBackup = today(); await saveState();
    const blob = new Blob([JSON.stringify({ app:'garazovy-denik', v:1, S, SESS }, null, 1)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `garazovy-denik-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    render(); toast('Záloha stažená. Ulož ji do iCloudu.');
  }
  else if (act === 'gotelo') { tab = 'telo'; render(); window.scrollTo({ top: 0 }); }
  else if (act === 'newblock') { S.start = today(); render(); try { await saveState(); toast('Nový blok začíná dnes.'); } catch(err) { failSave(err); } }
  else if (act === 'warmdone') { draft.warmDone = !draft.warmDone; persistDraft(); render(); }
  else if (act === 'closeres') { lastResult = null; render(); }
  else if (act === 'resetdraft') { draft = newDraft(S.next); lsDel('gd_draft'); render(); toast('Záznam zahozen.'); }
  else if (act === 'save') { if (!loaded) { toast('Ještě se načítají data, chvilku.'); return; } saveWorkout(); }
  else if (act === 'deload') {
    for (const k in EX) { const p = S.prog[k]; if ((p.stall || 0) >= 4 && EX[k].type !== 'stage') { p.w = round(p.w * 0.9, stepFor(EX[k])); p.t = EX[k].min; p.stall = 0; } }
    draft = newDraft(draft.tpl); persistDraft(); render();
    try { await saveState(); toast('Deload nastaven: −10 %, zpět na spodní opakování.'); } catch(err) { failSave(err); }
  }
  else if (act === 'addmetric') {
    const w = num($('#m-w').value), p = num($('#m-p').value), d = $('#m-d').value || today();
    if (w == null && p == null) { toast('Zadej váhu nebo pas.'); return; }
    S.metrics = S.metrics.filter(x => x.d !== d); S.metrics.push({ d, weight: w, waist: p });
    render(); try { await saveState(); toast('Uloženo.'); } catch(err) { failSave(err); }
  }
  else if (act === 'addcardio') {
    const m = num($('#c-m').value), t = $('#c-t').value, d = $('#c-d').value || today();
    if (!m) { toast('Zadej minuty.'); return; }
    if (t === 'Swing EMOM') { S.cardio.push({ d, type: t, min: 0, emom: Math.round(m) }); }
    else S.cardio.push({ d, type: t, min: Math.round(m) });
    if (S.cardio.length > 300) S.cardio = S.cardio.slice(-300);
    render(); try { await saveState(); toast('Uloženo.'); } catch(err) { failSave(err); }
  }
  else if (act === 'dellast') {
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Opravdu smazat? Klepni znovu'; return; }
    const last = SESS.pop(); if (!last) return;
    S.prog = mergeState({ prog: last.before }).prog; S.next = last.tpl;
    draft = newDraft(S.next); lsDel('gd_draft'); lastResult = null; render();
    try { await removeSession(last); await saveState(); toast('Smazáno, progrese vrácena.'); } catch(err) { failSave(err); }
  }
  else if (act === 'saveedit') {
    for (const k in EX) {
      const def = EX[k], p = S.prog[k];
      const t = num(($('#e-t-' + k) || {}).value); if (t) p.t = Math.max(1, Math.round(t));
      if (def.type === 'stage') { const s = $('#e-s-' + k); if (s) p.stage = +s.value; }
      else { const w = num(($('#e-w-' + k) || {}).value); if (w != null) p.w = w; }
      p.stall = 0;
    }
    draft = newDraft(draft.tpl); persistDraft(); render();
    try { await saveState(); toast('Úpravy uloženy.'); } catch(err) { failSave(err); }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'imp' && el.files && el.files[0]) {
    const fr = new FileReader();
    fr.onload = async () => {
      try {
        const o = JSON.parse(fr.result);
        if (o.app !== 'garazovy-denik' || !o.S || !Array.isArray(o.SESS)) throw 0;
        S = mergeState(o.S); SESS = o.SESS; draft = newDraft(S.next); lsDel('gd_draft');
        lsSet('gd_sessions', SESS); await saveState(); render(); toast(`Nahráno: ${SESS.length} tréninků.`);
      } catch(err) { toast('Tohle není záloha Garážového deníku.'); }
    };
    fr.readAsText(el.files[0]); return;
  }
  if (el.dataset.w) { draft.items[el.dataset.w].w = num(el.value); persistDraft(); render(); }
  if (el.dataset.rep) { draft.items[el.dataset.rep].reps[+el.dataset.i] = Math.max(0, Math.round(num(el.value) ?? 0)); persistDraft(); render(); }
});

/* ---------- Timer ---------- */
let tEnd = 0, tInt = null;
function startTimer(sec, name){
  tEnd = Date.now() + sec * 1000; $('#timerLabel').textContent = 'Pauza · ' + name;
  $('#timer').hidden = false; $('#timer').classList.remove('done');
  clearInterval(tInt); tick(); tInt = setInterval(tick, 250);
}
function tick(){
  const s = Math.max(0, Math.ceil((tEnd - Date.now()) / 1000));
  $('#timerT').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  if (s === 0 && !$('#timer').classList.contains('done')) {
    $('#timer').classList.add('done'); $('#timerT').textContent = 'Jdi na to';
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch(e) {}
    clearInterval(tInt);
  }
}
$('#timerAdd').addEventListener('click', () => { tEnd = Math.max(tEnd, Date.now()) + 30000; $('#timer').classList.remove('done'); clearInterval(tInt); tick(); tInt = setInterval(tick, 250); });
$('#timerStop').addEventListener('click', () => { clearInterval(tInt); $('#timer').hidden = true; });

/* ---------- Boot ---------- */
render(); setStatus();
(async () => {
  await initStore();
  try { await loadAll(); }
  catch(e) {
    if (store.mode === 'db') { toast('Účet teď neodpovídá, ukládám dočasně do prohlížeče.'); store.mode = 'local'; S = mergeState(lsGet('gd_state')); SESS = lsGet('gd_sessions') || []; }
  }
  loaded = true;
  const saved = lsGet('gd_draft');
  draft = saved && TPL[saved.tpl] && saved.date === today() ? saved : newDraft(S.next);
  setStatus(); render();
})();
</script>
